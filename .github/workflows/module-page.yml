# Module page (web/local, served by the module at /onspotify/ from page/).
#
# page/ is committed, but CI owns it: every push to dev deletes it, rebuilds it and commits it as the
# bot, so dev (and master, through dev -> master PRs) always has a page built from its sources.
# Nobody has to commit page/ by hand, local builds can be left out of commits.
#
# The "Module page" commit status marks a commit whose page/ was built by CI, master requires it.
# Commits pushed with GITHUB_TOKEN do not start new workflow runs, so it is set by hand.
name: Module page

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]
    # edited: the release check reads the PR title
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  # PRs (forks included): only check that the page builds, the push to dev rebuilds it after merging
  build:
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build:local --prefix web

  # Pushes to dev: rebuild and commit page/
  rebuild:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # A newer push makes this build outdated (and its push would be rejected)
    concurrency:
      group: module-page-dev
      cancel-in-progress: true
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web

      - name: Build
        run: |
          rm -rf page
          npm run build:local --prefix web

      - name: Commit the page
        run: |
          git add -A page
          if git diff --cached --quiet; then
            echo "page/ is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build module page"
            git push origin HEAD:dev
          fi
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Also when nothing changed: the dev -> master PR is checked on the head of dev
      - name: Mark the page as built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success -f context="Module page" -f description="page/ built from web/local"

  # PRs into master (master requires it): releases go dev -> master, with the new version in the title
  release-check:
    name: Release check
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the source branch
        if: github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'dev'
        run: |
          echo "::error::Releases are PRs from dev into master. Other branches and forks go into dev."
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check the version
        env:
          # Through env, never inlined in the script (the title is user input)
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --depth=1 origin master
          git show origin/master:package.json > master-package.json
          node <<'JS'
          const version = require("./package.json").version
          const released = require("./master-package.json").version
          const parts = (v) => v.split("-")[0].split(".").map(Number)
          const newer = (a, b) => {
            const [x, y] = [parts(a), parts(b)]
            for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] > y[i]
            return false
          }
          const fail = (message) => {
            console.log(`::error::${message}`)
            process.exitCode = 1
          }
          if (!newer(version, released))
            fail(`package.json is ${version}, master is ${released}. Bump the version on dev.`)
          // "v7.0.0" or "7.0.0", not part of a longer version like 7.0.0.1 or 17.0.0
          const escaped = version.replace(/[.+]/g, "\\$&")
          if (!new RegExp(`(^|[^\\w.])v?${escaped}(?![\\w.-])`).test(process.env.TITLE))
            fail(`The PR title has to include the version from package.json, e.g. "v${version}"`)
          if (!process.exitCode) console.log(`Release ${released} -> ${version}`)
          JS
