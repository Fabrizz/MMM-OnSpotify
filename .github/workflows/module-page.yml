# Module page (web/local, served by the module at /onspotify/ from page/).
#
# page/ is ignored and only exists on master, where users install from. Every PR into master gets
# the page deleted, rebuilt and pushed to its branch, then the "Module page" commit status is set,
# which master requires. Commits pushed with GITHUB_TOKEN do not start new workflow runs, so the
# status is set by hand on the rebuilt commit.
#
# PRs into master come from a release branch (e.g. version/7.0.0, made from dev), never from dev
# itself: the built page would end up on dev.
name: Module page

on:
  pull_request:
    branches: [master, dev]

concurrency:
  group: module-page-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # PRs into dev (forks included): only check that the page builds
  build:
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run build:local --prefix web

  # PRs into master: rebuild the page into the release branch
  release:
    if: github.base_ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Check the source branch
        if: github.event.pull_request.head.repo.full_name != github.repository || github.head_ref == 'dev'
        run: |
          echo "::error::PRs into master come from a release branch of this repo (e.g. version/7.0.0), not from dev or a fork. Contributions go to dev."
          exit 1

      - uses: actions/checkout@v5
        with:
          # The branch itself (not the merge commit), so the page can be pushed to it
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge master
        # master has the previous build in page/, merging it first avoids add/add conflicts on merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/master

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web

      - name: Build
        run: |
          rm -rf page
          npm run build:local --prefix web

      - name: Push the page
        run: |
          # page/ is in .gitignore, it is only tracked on master
          git add -f -A page
          git diff --cached --quiet || git commit -m "Build module page"
          git push
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Mark the page as built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success -f context="Module page" -f description="page/ built from web/local"
